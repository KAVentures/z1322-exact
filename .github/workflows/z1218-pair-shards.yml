name: Z1218 hard-cube pair shards

on:
  pull_request:
    paths:
      - 'z1218/src/generate_pair_shard.py'
      - '.github/workflows/z1218-pair-shards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no8-pairs:
    name: no8-d${{ matrix.d0 }}-d${{ matrix.d1 }}-q${{ matrix.q }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        d0: [5, 6]
        d1: [5, 6, 7, 8, 9, 10, 11, 12]
        q: [1, 2, 3]
    defaults:
      run:
        working-directory: z1218
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned solver and checker
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential zlib1g-dev
          git clone --depth 1 --branch rel-4.0.4 https://github.com/arminbiere/kissat.git tools/kissat
          (cd tools/kissat && ./configure && make -j2)
          git clone --depth 1 https://github.com/marijnheule/drat-trim.git tools/drat-trim
          (cd tools/drat-trim && make -j2)
      - name: Generate, solve and verify
        run: |
          set -euxo pipefail
          dir=results/pairs/no8-d${{ matrix.d0 }}-d${{ matrix.d1 }}-q${{ matrix.q }}
          mkdir -p "$dir"
          PYTHONPATH=src python3 src/generate_pair_shard.py --branch no8 \
            --degree0 ${{ matrix.d0 }} --degree1 ${{ matrix.d1 }} \
            --intersection ${{ matrix.q }} --out "$dir/instance.cnf"
          {
            echo "kissat_commit=$(git -C tools/kissat rev-parse HEAD)"
            echo "drat_trim_commit=$(git -C tools/drat-trim rev-parse HEAD)"
          } > "$dir/toolchain.txt"
          sha256sum src/*.py "$dir/instance.cnf" > "$dir/INPUT_SHA256.txt"
          set +e
          timeout --signal=TERM --kill-after=60s 19800 \
            tools/kissat/build/kissat --no-binary "$dir/instance.cnf" "$dir/proof.drat" \
            > "$dir/solver.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$dir/solver.exit"
          if [[ "$rc" == 20 ]]; then
            echo UNSAT > "$dir/result.txt"
            tools/drat-trim/drat-trim "$dir/instance.cnf" "$dir/proof.drat" | tee "$dir/checker.log"
            grep -E 's VERIFIED|VERIFIED' "$dir/checker.log"
            sha256sum "$dir/proof.drat" > "$dir/proof.sha256"
            gzip -9 "$dir/proof.drat"
          elif [[ "$rc" == 10 ]]; then
            echo SAT > "$dir/result.txt"
            python3 src/verify_model.py --branch no8 --log "$dir/solver.log" --out "$dir/witness.csv" | tee "$dir/model_check.log"
          else
            echo UNKNOWN > "$dir/result.txt"
            exit 1
          fi
          sha256sum "$dir"/* > "$dir/FINAL_SHA256.txt"
      - name: Upload certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z1218-no8-d${{ matrix.d0 }}-d${{ matrix.d1 }}-q${{ matrix.q }}
          path: z1218/results/pairs/no8-d${{ matrix.d0 }}-d${{ matrix.d1 }}-q${{ matrix.q }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  row8-d11-pairs:
    name: row8-d11-d${{ matrix.d1 }}-q${{ matrix.q }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        d1: [5, 6, 7, 8, 9, 10, 11, 12]
        q: [1, 2, 3]
    defaults:
      run:
        working-directory: z1218
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned solver and checker
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential zlib1g-dev
          git clone --depth 1 --branch rel-4.0.4 https://github.com/arminbiere/kissat.git tools/kissat
          (cd tools/kissat && ./configure && make -j2)
          git clone --depth 1 https://github.com/marijnheule/drat-trim.git tools/drat-trim
          (cd tools/drat-trim && make -j2)
      - name: Generate, solve and verify
        run: |
          set -euxo pipefail
          dir=results/pairs/row8-d11-d${{ matrix.d1 }}-q${{ matrix.q }}
          mkdir -p "$dir"
          PYTHONPATH=src python3 src/generate_pair_shard.py --branch row8 \
            --degree0 11 --degree1 ${{ matrix.d1 }} \
            --intersection ${{ matrix.q }} --out "$dir/instance.cnf"
          {
            echo "kissat_commit=$(git -C tools/kissat rev-parse HEAD)"
            echo "drat_trim_commit=$(git -C tools/drat-trim rev-parse HEAD)"
          } > "$dir/toolchain.txt"
          sha256sum src/*.py "$dir/instance.cnf" > "$dir/INPUT_SHA256.txt"
          set +e
          timeout --signal=TERM --kill-after=60s 19800 \
            tools/kissat/build/kissat --no-binary "$dir/instance.cnf" "$dir/proof.drat" \
            > "$dir/solver.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$dir/solver.exit"
          if [[ "$rc" == 20 ]]; then
            echo UNSAT > "$dir/result.txt"
            tools/drat-trim/drat-trim "$dir/instance.cnf" "$dir/proof.drat" | tee "$dir/checker.log"
            grep -E 's VERIFIED|VERIFIED' "$dir/checker.log"
            sha256sum "$dir/proof.drat" > "$dir/proof.sha256"
            gzip -9 "$dir/proof.drat"
          elif [[ "$rc" == 10 ]]; then
            echo SAT > "$dir/result.txt"
            python3 src/verify_model.py --branch row8 --log "$dir/solver.log" --out "$dir/witness.csv" | tee "$dir/model_check.log"
          else
            echo UNKNOWN > "$dir/result.txt"
            exit 1
          fi
          sha256sum "$dir"/* > "$dir/FINAL_SHA256.txt"
      - name: Upload certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z1218-row8-d11-d${{ matrix.d1 }}-q${{ matrix.q }}
          path: z1218/results/pairs/row8-d11-d${{ matrix.d1 }}-q${{ matrix.q }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
