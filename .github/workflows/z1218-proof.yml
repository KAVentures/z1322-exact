name: Z1218 proof-producing decision

on:
  pull_request:
    paths:
      - 'z1218/**'
      - '.github/workflows/z1218-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decide:
    name: ${{ matrix.branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        branch: [no8, row8]
    defaults:
      run:
        working-directory: z1218
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential zlib1g-dev

      - name: Build pinned CaDiCaL and DRAT-trim
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch rel-3.0.1 https://github.com/arminbiere/cadical.git tools/cadical
          (cd tools/cadical && ./configure && make -j2)
          git clone https://github.com/marijnheule/drat-trim.git tools/drat-trim
          (cd tools/drat-trim && git checkout 8b2a9f3efb5c7b2d87db3b0c9fb421da1c6f0f38 || true && make -j2)
          mkdir -p results/${{ matrix.branch }}
          {
            echo "cadical_commit=$(git -C tools/cadical rev-parse HEAD)"
            echo "drat_trim_commit=$(git -C tools/drat-trim rev-parse HEAD)"
            tools/cadical/build/cadical --version
          } | tee results/${{ matrix.branch }}/toolchain.txt

      - name: Verify encodings and generate exact CNF
        run: |
          set -euxo pipefail
          PYTHONPATH=src python3 src/test_cardinality.py | tee results/${{ matrix.branch }}/test_cardinality.log
          PYTHONPATH=src python3 src/test_lex.py | tee results/${{ matrix.branch }}/test_lex.log
          python3 src/generate_cnf.py --branch ${{ matrix.branch }} --out results/${{ matrix.branch }}/instance.cnf
          sha256sum src/*.py results/${{ matrix.branch }}/instance.cnf | tee results/${{ matrix.branch }}/INPUT_SHA256.txt

      - name: Solve and independently verify
        run: |
          set -euxo pipefail
          dir=results/${{ matrix.branch }}
          set +e
          timeout --signal=TERM --kill-after=60s 19800 \
            tools/cadical/build/cadical "$dir/instance.cnf" "$dir/proof.drat" \
            > "$dir/solver.log" 2>&1
          rc=$?
          set -e
          echo "$rc" | tee "$dir/solver.exit"
          if [[ "$rc" == 20 ]]; then
            echo UNSAT | tee "$dir/result.txt"
            timeout --signal=TERM --kill-after=60s 19800 \
              tools/drat-trim/drat-trim "$dir/instance.cnf" "$dir/proof.drat" \
              | tee "$dir/checker.log"
            grep -E 's VERIFIED|VERIFIED' "$dir/checker.log"
            sha256sum "$dir/proof.drat" | tee "$dir/proof.sha256"
            gzip -9 "$dir/proof.drat"
          elif [[ "$rc" == 10 ]]; then
            echo SAT | tee "$dir/result.txt"
            python3 src/verify_model.py --branch ${{ matrix.branch }} \
              --log "$dir/solver.log" --out "$dir/witness.csv" \
              | tee "$dir/model_check.log"
          else
            echo UNKNOWN | tee "$dir/result.txt"
            exit 1
          fi
          sha256sum "$dir"/* | tee "$dir/FINAL_SHA256.txt"

      - name: Upload complete reproducibility artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z1218-${{ matrix.branch }}-certificate
          path: z1218/results/${{ matrix.branch }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
