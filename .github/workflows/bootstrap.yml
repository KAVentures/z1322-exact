name: Bootstrap full repository

on:
  push:
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and expand prepared repository
        shell: bash
        run: |
          set -euo pipefail
          marker=".bootstrap/READY"
          if [[ ! -f "$marker" ]]; then
            echo "Bootstrap marker is absent; nothing to do."
            exit 0
          fi
          expected="$(cat "$marker")"
          cat .bootstrap/parts/part-* | base64 --decode > "$RUNNER_TEMP/z1322-exact.zip"
          actual="$(sha256sum "$RUNNER_TEMP/z1322-exact.zip" | awk '{print $1}')"
          test "$actual" = "$expected"
          work="$RUNNER_TEMP/z1322-bootstrap"
          mkdir -p "$work"
          unzip -q "$RUNNER_TEMP/z1322-exact.zip" -d "$work"
          cp -a "$work/z1322-exact/." .
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish certified proof and manuscript"
          git push origin HEAD:main
