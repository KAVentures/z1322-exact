name: Publish full repository

# One-time retrigger for exact repository replacement.
on:
  push:
    paths:
      - "z1322-exact-github-ready*.zip"
      - ".github/workflows/bootstrap.yml"
  pull_request:
    paths:
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPECTED_SHA256: "318cb5c81390aa2168cda91f6b8cd737856c5b8195d89dd438487dcfa7ff8dbd"

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive and publish clean tree
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find . -maxdepth 1 -type f -name 'z1322-exact-github-ready*.zip' -printf '%P\n' | sort)
          if [[ "${#archives[@]}" -ne 1 ]]; then
            printf 'Expected exactly one uploaded archive; found %s:\n' "${#archives[@]}"
            printf '  %s\n' "${archives[@]:-<none>}"
            exit 1
          fi
          archive="${archives[0]}"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"

          work="$RUNNER_TEMP/z1322-bootstrap"
          mkdir -p "$work"
          unzip -q "$archive" -d "$work"
          test -d "$work/z1322-exact"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan published
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$work/z1322-exact/." .
          git add -A
          git commit -m "Initial certified proof and manuscript"
          git push --force origin HEAD:main
