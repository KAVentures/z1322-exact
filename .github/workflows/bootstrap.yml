name: Publish full repository

on:
  push:
    paths:
      - "z1322-exact-github-ready.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive and publish clean tree
        shell: bash
        run: |
          set -euo pipefail
          archive="z1322-exact-github-ready.zip"
          expected="318cb5c81390aa2168cda91f6b8cd737856c5b8195d89dd438487dcfa7ff8dbd"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          test "$actual" = "$expected"

          work="$RUNNER_TEMP/z1322-bootstrap"
          mkdir -p "$work"
          unzip -q "$archive" -d "$work"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan published
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$work/z1322-exact/." .
          git add -A
          git commit -m "Initial certified proof and manuscript"
          git push --force origin HEAD:main
